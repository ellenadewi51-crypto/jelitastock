<title>JelitaStock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Tata letak: sidebar biru tua + area kerja; di HP sidebar menjadi navigasi bawah. Kasir = dua panel (produk | keranjang). */
:root{
  --bg:#eef2f6;--surface:#ffffff;--surface2:#f5f8fb;--line:#dce4ec;--fg:#0f2233;--muted:#586a7b;
  --nav:#0d1f2d;--nav-fg:#b9c9d8;--nav-on:#173a50;--nav-line:#1b3447;
  --accent:#1f6f8b;--accent-fg:#ffffff;--accent-soft:#e0eff4;
  --ok-fg:#fff;--ok:#1b8657;--ok-soft:#dcf2e6;--warn:#a86a0c;--warn-soft:#fcefd2;--bad:#c0392b;--bad-soft:#fbe3e0;--amber:#e3a02b;
  --tl:30%;--shadow:0 1px 2px rgba(15,34,51,.06),0 6px 20px rgba(15,34,51,.06);
  --fd:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09131c;--surface:#102130;--surface2:#142838;--line:#223a4c;--fg:#e5eef5;--muted:#8da2b4;
  --nav:#060f17;--nav-fg:#8fa6b9;--nav-on:#12303f;--nav-line:#14283a;
  --accent:#4cb0d0;--accent-fg:#052029;--accent-soft:#123647;
  --ok-fg:#04210f;--ok:#4cc68f;--ok-soft:#113626;--warn:#e8b552;--warn-soft:#3a2e12;--bad:#ff8173;--bad-soft:#401b18;--amber:#e8b04a;
  --tl:74%;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09131c;--surface:#102130;--surface2:#142838;--line:#223a4c;--fg:#e5eef5;--muted:#8da2b4;
  --nav:#060f17;--nav-fg:#8fa6b9;--nav-on:#12303f;--nav-line:#14283a;
  --accent:#4cb0d0;--accent-fg:#052029;--accent-soft:#123647;
  --ok-fg:#04210f;--ok:#4cc68f;--ok-soft:#113626;--warn:#e8b552;--warn-soft:#3a2e12;--bad:#ff8173;--bad-soft:#401b18;--amber:#e8b04a;
  --tl:74%;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--fb);padding-left:0;padding-right:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto}
textarea{resize:vertical}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.right{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}
.btn.amb{background:var(--amber);border-color:var(--amber);color:#2a1c00}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn.lg{min-height:48px;font-size:16px;padding:12px 20px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;padding:0;position:relative}
.ib:hover{background:var(--surface2)}
.dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px;min-width:17px;text-align:center}

/* pill status */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lbrand{background:var(--nav);color:#e8f1f7;padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.lbrand h1{font-size:clamp(30px,4vw,46px);font-weight:800;letter-spacing:-.02em}
.lbrand p{color:#9db3c4;max-width:36ch;font-size:16px;margin:10px 0 0}
.lbrand ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;color:#b9c9d8}
.lbrand li{display:flex;gap:10px;align-items:center}
.lbrand li svg{color:#5fc9a0}
.lbrand small{color:#6f889b}
.lform{display:grid;place-items:center;padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.lcard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);display:grid;gap:14px}
.lcard h2{font-size:22px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:20px;letter-spacing:-.01em}
.logo b{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2a8fae,#1b5f78);display:grid;place-items:center;color:#fff;font-size:18px}
.demo{display:flex;flex-wrap:wrap;gap:6px}
.demo button{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.demo button:hover{border-color:var(--accent);color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* kerangka aplikasi */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--nav);color:var(--nav-fg);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto;min-height:0}
.side .logo{color:#fff;padding:4px 8px 16px}
.side .sub{font-size:11px;color:#6c8499;padding:0 8px 10px;margin-top:-12px}
.nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:inherit;background:none;border:0;cursor:pointer;text-align:left;width:100%;font-weight:500}
.nv:hover{background:var(--nav-line);color:#fff}
.nv.on{background:var(--nav-on);color:#fff;box-shadow:inset 3px 0 0 var(--amber)}
.nv .n{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:700}
.side .sp{flex:1}
.me{border-top:1px solid var(--nav-line);padding:12px 8px 4px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--nav-on);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--fd);flex:none}
.me div{min-width:0;line-height:1.25}.me b{display:block;color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me small{font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);min-height:62px}
.top h2{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .tools{display:flex;gap:8px;align-items:center}
.content{flex:1;min-height:0;overflow:auto;padding:22px 24px 32px}
.content.pos{overflow:hidden;padding:0}
.bnav{display:none}

/* kartu & grid */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .btn{margin-left:auto}
.g{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;border-top:3px solid var(--accent);min-width:0}
.kpi.w{border-top-color:var(--amber)}.kpi.b{border-top-color:var(--bad)}.kpi.o{border-top-color:var(--ok)}
.kpi small{color:var(--muted);font-weight:500}
.kpi strong{display:block;font:800 clamp(20px,2.2vw,26px)/1.2 var(--fd);margin-top:4px;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--muted)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .grow{flex:1;min-width:180px}
.bar select{width:auto;min-width:150px}
.sw{position:relative}.sw svg{position:absolute;left:11px;top:50%;translate:0 -50%;color:var(--muted)}.sw input{padding-left:36px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fc{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.fc.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* tabel */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{background:var(--nav);color:#dbe7f0;text-align:left;font-size:12px;font-weight:600;padding:10px 12px;white-space:nowrap;letter-spacing:.02em}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--surface2)}
td.act{white-space:nowrap;text-align:right}
td[data-l]{white-space:nowrap}td.nm{white-space:normal}
@media (min-width:961px){.tw table{min-width:720px}}
td .sub{display:block;color:var(--muted);font-size:12px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.pg{display:flex;gap:4px}.pg button{min-width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}.pg .on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* kasir */
.posw{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
.pl{display:flex;flex-direction:column;min-height:0;min-width:0;padding:16px 18px 0 24px;gap:12px}
.shiftbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.shiftbar .btn{margin-left:auto}
.cats{display:flex;gap:8px;overflow:auto;padding-bottom:2px;flex:none}
.cats .fc{white-space:nowrap}
.pgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;align-content:start;padding:2px 2px 24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile:active{transform:scale(.98)}
.tile[disabled]{opacity:.45;cursor:not-allowed}
.art{height:104px;border-radius:8px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,hsl(var(--h) 40% 98%/.95),hsl(var(--h) 45% 60%/.2));overflow:hidden}
.art img{height:100%;width:100%;object-fit:contain;display:block;padding:2px}
.th{width:46px;height:46px;border-radius:10px;object-fit:contain;background:linear-gradient(160deg,var(--surface2),var(--accent-soft));padding:2px;flex:none;border:1px solid var(--line)}
.th.lg{width:112px;height:112px;border-radius:14px}
.pn,.cn{display:flex;gap:10px;align-items:center;min-width:0;text-align:left}.pn>div,.cn>div{min-width:0}
.pf{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tile b{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.tile .pr{font-weight:700;color:var(--accent)}
.tile .st{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;background:var(--surface);border-radius:99px;padding:1px 7px;border:1px solid var(--line)}
.tile .st.low{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tile .st.zero{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cart header h3{font-size:16px;flex:1}
.citems{flex:1;overflow:auto;padding:4px 18px}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.ci b{font-weight:600}.ci .sub{color:var(--muted);font-size:12px}
.qty{justify-self:start;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:30px;height:30px;border:0;background:var(--surface2);cursor:pointer;display:grid;place-items:center}
.qty input{width:44px;border:0;border-radius:0;text-align:center;padding:4px;background:transparent}
.cfoot{border-top:1px solid var(--line);padding:12px 18px 16px;display:grid;gap:10px;background:var(--surface)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.row.t{font:800 20px var(--fd)}
.cbtn{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.cartbar{display:none}
.mx{display:none}
.cempty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(5,14,22,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.dlg{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.dlg.w{max-width:760px}.dlg.s{max-width:400px}
.dlg>header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg>header h3{flex:1;font-size:17px}
.dlg>.bd{padding:18px 20px;overflow:auto;display:grid;gap:14px;align-content:start}
.dlg>footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.f{display:grid;gap:5px}.f label{font-weight:600;font-size:13px}.f small{color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pm{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-weight:600;cursor:pointer}
.pm.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.big{font:800 30px var(--fd);text-align:center;padding:6px 0}
.struk{font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:14px;overflow:auto;margin:0}
.list{display:grid;gap:8px}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2);min-width:0}
.li>div{min-width:0}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.al:first-of-type{border-top:0}
.al svg{margin-top:2px}.al.bad svg{color:var(--bad)}.al.warn svg{color:var(--warn)}.al.info svg{color:var(--accent)}
.rk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.rk:first-of-type{border-top:0}.rk i{font-style:normal;color:var(--muted);font-weight:700}
.rk .meter{grid-column:2/4;height:5px;background:var(--surface2);border-radius:9px;overflow:hidden}.rk .meter u{display:block;height:100%;background:var(--accent);border-radius:9px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.note.info{background:var(--accent-soft);color:var(--accent)}
.toasts{position:fixed;left:50%;bottom:20px;translate:-50% 0;display:grid;gap:8px;z-index:80;width:max-content;max-width:calc(100% - 32px)}
.toast{background:#0d1f2d;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:500;border-left:4px solid var(--ok)}
.toast.e{border-left-color:var(--bad)}
.hl{background:var(--accent-soft)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--fb)}
.chart .v{fill:var(--fg);font-weight:600}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{display:none}
  .app>.main{grid-row:1}
  .top{padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));min-height:56px;position:sticky;top:env(safe-area-inset-top,0px)}
  .top h2{font-size:18px}
  .content{padding:16px max(14px,env(safe-area-inset-right,0px)) 24px max(14px,env(safe-area-inset-left,0px))}
  .bnav{display:flex;background:var(--nav);padding:6px max(6px,env(safe-area-inset-right,0px)) 6px max(6px,env(safe-area-inset-left,0px));grid-row:2;gap:2px}
  .bnav button{flex:1;background:none;border:0;color:var(--nav-fg);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 2px;border-radius:10px;cursor:pointer;min-width:0}
  .bnav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .bnav button.on{background:var(--nav-on);color:#fff}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21{grid-template-columns:minmax(0,1fr)}
  .g2{grid-template-columns:minmax(0,1fr)}
  .posw{grid-template-columns:minmax(0,1fr)}
  .pl{padding:12px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));padding-bottom:84px}
  .cart{position:fixed;inset:0;z-index:40;transform:translateY(100%);transition:transform .25s;border:0;padding-top:env(safe-area-inset-top,0px)}
  .cart.open{transform:none}
  .mx{display:inline-flex}
  .cartbar{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px 16px;justify-content:space-between;align-items:center;font-weight:700;box-shadow:var(--shadow);cursor:pointer;gap:10px}
  .cfoot{padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
  .toasts{bottom:calc(80px + env(safe-area-inset-bottom,0px))}

  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

}

/* ---------- stok ---------- */
function stats(){
  const t=today(),lim=ymd(addDays(new Date(),S().hari_exp)),m={};
  for(const p of DB.products)m[p.id]={tot:0,sell:0,exp:null,expiredQty:0,soonQty:0};
  for(const b of DB.batches){
    if(b.jumlah<=0)continue;const r=m[b.id_produk];if(!r)continue;
    r.tot+=b.jumlah;
    if(b.exp&&b.exp<t)r.expiredQty+=b.jumlah;else{r.sell+=b.jumlah;if(b.exp&&b.exp<=lim)r.soonQty+=b.jumlah}
    if(b.exp&&(!r.exp||b.exp<r.exp))r.exp=b.exp;
  }
  return m;
}
function statusOf(p,s){
  if(s.expiredQty>0)return['bad','Kedaluwarsa'];
  if(s.sell<=0)return['bad','Habis'];
  if(s.sell<=p.min)return['warn','Menipis'];
  if(s.soonQty>0)return['warn','Hampir kedaluwarsa'];
  return['ok','Aman'];
}

function autoBatch(){const d=new Date();return 'B'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+Math.floor(Math.random()*90+10)}
function addStock(pid,qty,exp,kode,ket){DB.batches.push({id:uid('b'),id_produk:pid,kode:kode||autoBatch(),jumlah:qty,exp:exp||null,masuk:today()});mov(pid,'masuk',qty,ket)}
/* FEFO: ambil dari batch dengan kedaluwarsa paling awal; mengembalikan alokasi */
function takeFEFO(pid,qty,any){
  const t=today(),bs=DB.batches.filter(b=>b.id_produk===pid&&b.jumlah>0&&(any||!(b.exp&&b.exp<t))).sort((a,b)=>(a.exp||'9999')<(b.exp||'9999')?-1:1);
  let need=qty;const al=[];
  for(const b of bs){const k=Math.min(b.jumlah,need);b.jumlah-=k;need-=k;al.push({b:b.id,q:k});if(!need)break}
  return need?null:al;
}
function returnAlloc(pid,al){
  for(const a of al){const b=DB.batches.find(x=>x.id===a.b);if(b)b.jumlah+=a.q;else DB.batches.push({id:uid('b'),id_produk:pid,kode:autoBatch(),jumlah:a.q,exp:null,masuk:today()})}
}

    else if(s.sell<=0)out.push({c:'bad',t:`“${p.nama}” habis. Stok minimum ${p.min}.`,pg:'produk'});
    else if(s.sell<=p.min)out.push({c:'warn',t:`Stok “${p.nama}” tersisa ${s.sell} ${p.satuan} (batas minimum ${p.min}).`,pg:'produk'});
    if(s.soonQty>0&&!s.expiredQty){const b=DB.batches.filter(b=>b.id_produk===p.id&&b.jumlah>0&&b.exp&&b.exp>=today()).sort((a,b)=>a.exp<b.exp?-1:1)[0];if(b)out.push({c:'warn',t:`“${p.nama}” kedaluwarsa dalam ${daysTo(b.exp)} hari (batch ${b.kode}).`,pg:'produk'})}
  }
  const wait=DB.pos.filter(o=>o.status==='diajukan').length;
  if(wait)out.push({c:'info',t:`${wait} pesanan pembelian menunggu persetujuan pemilik.`,pg:'pembelian'});
  const rec=DB.pos.filter(o=>o.status==='disetujui').length;
  if(rec)out.push({c:'info',t:`${rec} pesanan pembelian disetujui dan menunggu penerimaan barang.`,pg:'pembelian'});
  const ord={bad:0,warn:1,info:2};return out.sort((a,b)=>ord[a.c]-ord[b.c]);
}
const salesOn=(from,to)=>DB.sales.filter(s=>s.status==='selesai'&&s.tanggal.slice(0,10)>=from&&s.tanggal.slice(0,10)<=to);

function chartBars(data,opt={}){
  // data: [{l,v,hi}] ; satu skala untuk batang, tick, dan label
  const W=560,H=230,L=44,B=28,T=22,R=8,max=Math.max(1,...data.map(d=>d.v));
  const step=(()=>{const raw=max/4,mag=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/mag;return (n<=1?1:n<=2?2:n<=5?5:10)*mag})();
  const top=Math.ceil(max/step)*step,sy=v=>T+(H-T-B)*(1-v/top),bw=(W-L-R)/data.length;
  let g='';for(let v=0;v<=top+1;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end">${short(v)}</text>`;
  const every=data.length>16?Math.ceil(data.length/10):1;
  data.forEach((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,y=sy(d.v);
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,sy(0)-y)}" rx="3" fill="${d.hi?'var(--amber)':'var(--accent)'}"><title>${esc(d.l)}: ${rp(d.v)}</title></rect>`;
    if(data.length<=10)g+=`<text class="v" x="${x+w/2}" y="${y-5}" text-anchor="middle">${short(d.v)}</text>`;

  const c=ui.cart;let subtotal=0;
  c.items.forEach(i=>{const p=prod(i.pid);if(p)subtotal+=p.jual*i.qty});
  let diskon=c.dtype==='pct'?Math.round(subtotal*Math.min(100,c.dval||0)/100):Math.min(subtotal,c.dval||0);
  const base=subtotal-diskon,ppn=S().ppn_aktif?Math.round(base*S().ppn/100):0;
  return{subtotal,diskon,ppn,total:base+ppn,qty:sum(c.items,i=>i.qty)};
}

function checkout(){

/* struk */
function rcptText(s){
  const W=S().kertas,L='-'.repeat(W),ctr=x=>' '.repeat(Math.max(0,Math.floor((W-x.length)/2)))+x,lr=(a,b)=>a+' '.repeat(Math.max(1,W-a.length-b.length))+b;
  const wrap=(x,w)=>{const o=[];while(x.length>w){let i=x.lastIndexOf(' ',w);if(i<5)i=w;o.push(x.slice(0,i));x=x.slice(i).trim()}o.push(x);return o};
  const o=[...wrap(S().toko,W).map(ctr),...wrap(S().alamat,W).map(ctr),ctr('Telp '+S().telepon),L,lr('No',s.nomor),lr('Tgl',fDT(s.tanggal)),lr('Kasir',userName(s.id_kasir).split(' ')[0])];
  if(s.pelanggan)o.push(lr('Pelanggan',s.pelanggan));o.push(L);
  s.items.forEach(i=>{o.push(...wrap(i.nama,W));o.push(lr(`  ${i.jumlah} x ${num(i.harga)}`,num(i.jumlah*i.harga)))});
  o.push(L,lr('Subtotal',num(s.subtotal)));if(s.diskon)o.push(lr('Diskon','-'+num(s.diskon)));if(s.ppn)o.push(lr('PPN '+S().ppn+'%',num(s.ppn)));
  o.push(lr('TOTAL',num(s.total)),lr(METODE[s.metode],num(s.bayar)));if(s.metode==='tunai')o.push(lr('Kembali',num(s.kembali)));
  if(s.status==='batal')o.push(L,ctr('*** TRANSAKSI DIBATALKAN ***'));
  o.push(L,...wrap(S().footer,W).map(ctr));return o.join('\n');
}
function showReceipt(s,fresh){
  const txt=rcptText(s);ui.rcpt=txt;
  openModal(fresh?'Transaksi berhasil':'Detail transaksi '+esc(s.nomor),`${fresh?`<div class="big num">${s.metode==='tunai'?'Kembalian '+rp(s.kembali):'Lunas '+rp(s.total)}</div>`:`<div class="row"><span>${s.status==='batal'?pill('bad','Dibatalkan'):pill('ok','Selesai')}</span><span class="muted">${esc(METODE[s.metode])}</span></div>`}<pre class="struk" id="rcptTxt">${esc(txt)}</pre>${s.alasan?`<div class="note">Alasan batal: ${esc(s.alasan)}</div>`:''}`,
   `${!fresh&&s.status==='selesai'&&role('pemilik','kepala')?`<button class="btn bad" data-act="voidAsk" data-id="${s.id}">Batalkan transaksi</button>`:''}<button class="btn" data-act="rcptCopy">${icon('copy')} Salin</button><button class="btn" data-act="rcptPrint">${icon('printer')} Cetak</button><button class="btn pri" data-act="closeModal">${fresh?'Transaksi baru':'Tutup'}</button>`);
}

  if(status==='diajukan'){o.status='diajukan';o.hist.push({tgl:nowISO(),teks:`Diajukan ke pemilik oleh ${ui.user.nama}`})}
  log(`Pesanan pembelian ${o.nomor} (${o.status})`);save();closeModal();renderPage();toast('Pesanan disimpan');
}

/* ---------- LAPORAN ---------- */
function rangeDates(){
  const t=today();
  if(ui.range==='custom')return[ui.rfrom||t,ui.rto||t];
  if(ui.range==='month')return[t.slice(0,8)+'01',t];
  return[ymd(addDays(new Date(),-(parseInt(ui.range)-1))),t];
}
PG.laporan=()=>{
  const t=ui.tab.lap||'jual',[f,to]=rangeDates();
  const tabs=`<div class="tabs">${[['jual','Penjualan'],['stok','Persediaan']].map(([k,l])=>`<button class="tab ${t===k?'on':''}" data-act="tab" data-pg="lap" data-k="${k}">${l}</button>`).join('')}</div>`;
  if(t==='stok')return tabs+lapStok();
  const ss=salesOn(f,to),tot=sum(ss,s=>s.total),hpp=sum(ss,s=>sum(s.items,i=>i.hpp*i.jumlah)),laba=tot-hpp-sum(ss,s=>s.ppn);
  const days=[];for(let d=dt(f);ymd(d)<=to&&days.length<62;d=addDays(d,1))days.push(ymd(d));
  const dd=days.map((k,i)=>{const x=salesOn(k,k);return{k,v:sum(x,s=>s.total),n:x.length,l:days.length<=7?HRI[dt(k).getDay()]:dt(k).getDate()+' '+BLN[dt(k).getMonth()],hi:k===today()}});
  const byP={};ss.forEach(s=>s.items.forEach(i=>{const r=byP[i.id_produk]||(byP[i.id_produk]={n:i.nama,q:0,v:0,l:0});r.q+=i.jumlah;r.v+=i.jumlah*i.harga;r.l+=(i.harga-i.hpp)*i.jumlah}));
  const topP=Object.values(byP).sort((a,b)=>b.q-a.q).slice(0,10);
  const byM={};ss.forEach(s=>{byM[s.metode]=(byM[s.metode]||0)+s.total});
  const byK={};ss.forEach(s=>{const r=byK[s.id_kasir]||(byK[s.id_kasir]={n:0,v:0});r.n++;r.v+=s.total});
  const showL=role('pemilik','kepala');
  return tabs+`<div class="bar"><select data-in="range" aria-label="Periode">${[['1','Hari ini'],['7','7 hari terakhir'],['30','30 hari terakhir'],['month','Bulan ini'],['custom','Pilih tanggal']].map(([v,l])=>`<option value="${v}" ${ui.range===v?'selected':''}>${l}</option>`).join('')}</select>${ui.range==='custom'?`<input type="date" data-in="rfrom" value="${f}" style="width:auto" aria-label="Dari"><input type="date" data-in="rto" value="${to}" style="width:auto" aria-label="Sampai">`:''}<span class="muted grow">${fDate(f)} – ${fDate(to)}</span><button class="btn" data-act="lapCsv">${icon('dl')} Ekspor CSV</button></div>
  <div class="g g4" style="margin-bottom:16px"><div class="kpi"><small>Penjualan</small><strong class="num">${rp(tot)}</strong><span>${ss.length} transaksi</span></div><div class="kpi o"><small>${showL?'Laba kotor':'Rata-rata transaksi'}</small><strong class="num">${showL?rp(laba):rp(ss.length?tot/ss.length:0)}</strong><span>${showL?`Margin ${tot?Math.round(laba/tot*100):0}%`:'Per transaksi'}</span></div><div class="kpi w"><small>Barang terjual</small><strong>${sum(ss,s=>sum(s.items,i=>i.jumlah))} unit</strong><span>${Object.keys(byP).length} jenis produk</span></div><div class="kpi"><small>Diskon diberikan</small><strong class="num">${rp(sum(ss,s=>s.diskon))}</strong><span>${ss.filter(s=>s.diskon).length} transaksi</span></div></div>
  <div class="card" style="margin-bottom:16px"><h3>Penjualan per hari</h3>${chartBars(dd)}</div>
  <div class="g g2" style="margin-bottom:16px"><div class="card"><h3>Produk terlaris</h3>${topP.length?`<div class="tw"><table><thead><tr><th>Produk</th><th class="right">Unit</th><th class="right">Omzet</th>${showL?'<th class="right">Laba</th>':''}</tr></thead><tbody>${topP.map(r=>`<tr><td>${esc(r.n)}</td><td class="right">${r.q}</td><td class="right num">${rp(r.v)}</td>${showL?`<td class="right num">${rp(r.l)}</td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada data.</div>'}</div>
  <div class="g"><div class="card"><h3>Metode pembayaran</h3>${Object.entries(byM).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="rk"><i></i><span>${METODE[k]}</span><b class="num">${rp(v)}</b><div class="meter"><u style="width:${v/tot*100}%"></u></div></div>`).join('')||'<div class="empty">Tidak ada data.</div>'}</div>
  <div class="card"><h3>Per kasir</h3>${Object.entries(byK).map(([k,r])=>`<div class="rk"><i></i><span>${esc(userName(k))} <span class="muted">· ${r.n} transaksi</span></span><b class="num">${rp(r.v)}</b></div>`).join('')||'<div class="empty">Tidak ada data.</div>'}</div></div></div>`;
};
function lapStok(){
  const st=stats(),act=DB.products.filter(p=>p.aktif),f30=ymd(addDays(new Date(),-29)),sold={};
  salesOn(f30,today()).forEach(s=>s.items.forEach(i=>{sold[i.id_produk]=(sold[i.id_produk]||0)+i.jumlah}));
  const val=sum(DB.batches,b=>(prod(b.id_produk)?.beli||0)*Math.max(0,b.jumlah));
  const exVal=sum(DB.batches.filter(b=>b.jumlah>0&&b.exp&&b.exp<today()),b=>(prod(b.id_produk)?.beli||0)*b.jumlah);
  const re=act.filter(p=>st[p.id].sell<=p.min).map(p=>({p,need:Math.max(p.min*2-st[p.id].sell,1)}));
  const cov=act.map(p=>{const v=(sold[p.id]||0)/30,s=st[p.id].sell;return{p,sold:sold[p.id]||0,s,days:v>0?Math.round(s/v):null}}).sort((a,b)=>(b.sold)-(a.sold)).slice(0,10);
  const exp=DB.batches.filter(b=>b.jumlah>0&&b.exp&&daysTo(b.exp)<=S().hari_exp).sort((a,b)=>a.exp<b.exp?-1:1);
  return `<div class="bar"><span class="muted grow">Kondisi persediaan per ${fDate(today())}</span><button class="btn" data-act="stokCsv">${icon('dl')} Ekspor CSV</button></div>
  <div class="g g4" style="margin-bottom:16px"><div class="kpi"><small>Nilai persediaan</small><strong class="num">${rp(val)}</strong><span>Harga beli</span></div><div class="kpi o"><small>Total unit</small><strong>${num(sum(Object.values(st),s=>s.tot))}</strong><span>${act.length} produk</span></div><div class="kpi w"><small>Perlu dipesan ulang</small><strong>${re.length}</strong><span>Di bawah batas minimum</span></div><div class="kpi b"><small>Nilai kedaluwarsa</small><strong class="num">${rp(exVal)}</strong><span>Sudah lewat tanggal</span></div></div>
  <div class="g g2"><div class="card"><h3>Usulan pemesanan ulang ${canPO()?`<button class="btn sm pri" data-act="poSuggest">Buat pesanan</button>`:''}</h3>${re.length?`<div class="tw"><table><thead><tr><th>Produk</th><th class="right">Stok</th><th class="right">Min</th><th class="right">Usulan</th></tr></thead><tbody>${re.map(r=>`<tr><td>${esc(r.p.nama)}</td><td class="right">${st[r.p.id].sell}</td><td class="right">${r.p.min}</td><td class="right"><b>${r.need}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Semua stok di atas batas minimum.</div>'}</div>
  <div class="card"><h3>Batch kedaluwarsa dan hampir kedaluwarsa</h3>${exp.length?`<div class="tw"><table><thead><tr><th>Produk</th><th>Batch</th><th>Tanggal</th><th class="right">Jml</th></tr></thead><tbody>${exp.map(b=>{const d=daysTo(b.exp);return `<tr><td>${esc(prod(b.id_produk)?.nama||'–')}</td><td>${esc(b.kode)}</td><td>${fDate(b.exp)} ${d<0?pill('bad','Lewat'):pill('warn',d+' hr')}</td><td class="right">${b.jumlah}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada.</div>'}</div></div>
  <div class="card" style="margin-top:16px"><h3>Perputaran persediaan (10 produk terlaris, 30 hari)</h3><div class="tw"><table class="rt"><thead><tr><th>Produk</th><th class="right">Terjual 30 hari</th><th class="right">Stok</th><th class="right">Perkiraan habis</th></tr></thead><tbody>${cov.map(r=>`<tr><td class="nm" data-l="Produk">${esc(r.p.nama)}</td><td class="right" data-l="Terjual">${r.sold}</td><td class="right" data-l="Stok">${r.s}</td><td class="right" data-l="Habis dalam">${r.days===null?'–':r.days+' hari'} ${r.days!==null&&r.days<=14?pill('warn','Cepat habis'):''}</td></tr>`).join('')}</tbody></table></div></div>`;
}

</script>
<script>
/* ---------- aksi (event delegation) ---------- */
function keep(fn){
  const a=document.activeElement;let sel=null,pos=0;
  if(a&&a.matches&&a.matches('input,textarea')){pos=a.selectionStart;sel=a.id?'#'+a.id:a.dataset.in?`[data-in="${a.dataset.in}"]`+(a.dataset.id?`[data-id="${a.dataset.id}"]`:'')+(a.dataset.i!==undefined?`[data-i="${a.dataset.i}"]`:''):null}
  fn();
  if(sel){const n=$(sel);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
}
const iv=id=>parseInt(String($('#'+id).value||'').replace(/\D/g,''))||0;
const ACT={
go:el=>go(el.dataset.p),
logout:()=>logout(),
lupa:(el,e)=>{e.preventDefault();toast('Hubungi pemilik toko untuk mengatur ulang kata sandi.')},
demo:el=>{$('#lu').value=el.dataset.u;$('#lp').value=el.dataset.p},
theme:el=>{const n=themeIsDark()?'light':'dark';document.documentElement.dataset.theme=n;lsSet(THM,n);el.innerHTML=icon(n==='dark'?'sun':'moon')},
bell:()=>{const a=alerts();openModal('Peringatan',a.length?a.map(x=>`<div class="al ${x.c}">${icon(x.c==='info'?'info':'alert')}<div style="flex:1">${esc(x.t)}</div>${can(x.pg)?`<button class="btn sm" data-act="go" data-p="${x.pg}">Buka</button>`:''}</div>`).join(''):'<div class="empty">Tidak ada peringatan.</div>',`<button class="btn pri" data-act="closeModal">Tutup</button>`)},
more:()=>{const rest=PAGES.filter(p=>can(p[0])).slice(4);openModal('Menu',`<div class="list">${rest.map(p=>`<button class="btn" data-act="go" data-p="${p[0]}" style="justify-content:flex-start">${icon(p[2])} ${p[1]}</button>`).join('')}<button class="btn bad" data-act="logout" style="justify-content:flex-start">${icon('logout')} Keluar (${esc(ui.user.nama)})</button></div>`,'')},
closeModal:()=>closeModal(),
doConfirm:()=>{const f=ui.confirm;closeModal();if(f)f()},
expCopy:()=>copyText(ui.exp.text),
expDl:()=>download(ui.exp.filename,ui.exp.text,ui.exp.mime),
tab:el=>{ui.tab[el.dataset.pg]=el.dataset.k;renderPage()},
pp:el=>{ui.pp=+el.dataset.n;$('#ptable').innerHTML=prodTable()},
/* kasir */
cat:el=>{ui.cat=el.dataset.k;renderPage()},
add:el=>{if(addToCart(el.dataset.id))refreshPos()},
qty:el=>{const it=ui.cart.items.find(i=>i.pid===el.dataset.id),d=+el.dataset.d;if(d>0){addToCart(it.pid)}else{it.qty--;if(it.qty<=0)ui.cart.items=ui.cart.items.filter(i=>i!==it)}refreshPos()},
rm:el=>{ui.cart.items=ui.cart.items.filter(i=>i.pid!==el.dataset.id);refreshPos()},
clearCart:()=>confirmBox('Kosongkan seluruh isi keranjang?','Kosongkan',()=>{ui.cart=newCart();refreshPos()},true),
hold:()=>{DB.held.push({id:uid('h'),tgl:nowISO(),user:ui.user.id,cart:ui.cart});ui.cart=newCart();save();refreshPos();$('#cart')?.classList.remove('open');toast('Pesanan disimpan sementara')},
heldList:()=>openModal('Pesanan tertahan',DB.held.length?`<div class="list">${DB.held.map(h=>`<div class="li"><div><b>${h.cart.items.length} produk · ${sum(h.cart.items,i=>i.qty)} item</b><div class="muted">${fTime(h.tgl)} · ${esc(h.cart.pelanggan||'Tanpa nama')}</div></div><div><button class="btn sm pri" data-act="heldResume" data-id="${h.id}">Lanjutkan</button> <button class="btn sm bad" data-act="heldDel" data-id="${h.id}">${icon('trash')}</button></div></div>`).join('')}</div>`:'<div class="empty">Tidak ada pesanan tertahan.</div>',`<button class="btn" data-act="closeModal">Tutup</button>`,'s'),
heldResume:el=>{const h=DB.held.find(x=>x.id===el.dataset.id);if(ui.cart.items.length)DB.held.push({id:uid('h'),tgl:nowISO(),user:ui.user.id,cart:ui.cart});ui.cart=h.cart;DB.held=DB.held.filter(x=>x!==h);save();closeModal();refreshPos()},
heldDel:el=>{DB.held=DB.held.filter(x=>x.id!==el.dataset.id);save();closeModal();refreshPos()},
cartOpen:()=>$('#cart').classList.add('open'),
cartClose:()=>$('#cart').classList.remove('open'),
pay:()=>openPay(),
pm:el=>{ui.pay.metode=el.dataset.k;$$('.pm').forEach(b=>b.classList.toggle('on',b===el));$('#cashbox').hidden=el.dataset.k!=='tunai';$('#refbox').hidden=el.dataset.k==='tunai'},
quick:el=>{$('#pb').value=el.dataset.v;INS.bayar($('#pb'))},
doPay:()=>checkout(),
openShift:()=>openShift(),
doOpenShift:()=>{const m=iv('sm');DB.shifts.push({id:uid('sh'),user:ui.user.id,buka:nowISO(),modal:m,tutup:null});log('Membuka shift kasir, modal '+rp(m));save();closeModal();renderPage()},
closeShift:()=>closeShiftModal(),
doCloseShift:()=>{const sh=DB.shifts.find(s=>!s.tutup),v=$('#sk').value;if(v==='')return toast('Isi jumlah uang tunai di laci',1);const k=iv('sk'),ss=DB.sales.filter(s=>s.id_shift===sh.id&&s.status==='selesai'),exp=sh.modal+sum(ss.filter(s=>s.metode==='tunai'),s=>s.total);sh.tutup=nowISO();sh.kas=k;sh.selisih=k-exp;log(`Menutup shift kasir, selisih kas ${rp(k-exp)}`);save();closeModal();ui.shiftAsked=false;renderPage();toast('Shift ditutup. Selisih kas '+rp(k-exp))},
/* riwayat */
saleView:el=>showReceipt(DB.sales.find(s=>s.id===el.dataset.id)),
voidAsk:el=>openModal('Batalkan transaksi',`<div class="muted">Stok produk akan dikembalikan ke batch asal. Tindakan ini tercatat di log aktivitas.</div><div class="f"><label for="va">Alasan pembatalan</label><input id="va"></div>`,`<button class="btn" data-act="closeModal">Kembali</button><button class="btn bad" data-act="voidDo" data-id="${el.dataset.id}">Batalkan transaksi</button>`,'s'),
voidDo:el=>{const s=DB.sales.find(x=>x.id===el.dataset.id),a=$('#va').value.trim();if(!a)return toast('Alasan wajib diisi',1);s.status='batal';s.alasan=a;s.items.forEach(i=>{returnAlloc(i.id_produk,i.alloc||[]);mov(i.id_produk,'void',i.jumlah,'Batal '+s.nomor)});log(`Membatalkan transaksi ${s.nomor}: ${a}`);save();closeModal();renderPage();toast('Transaksi dibatalkan')},
rcptCopy:()=>copyText(ui.rcpt),
rcptPrint:()=>{$('#printarea').innerHTML='<pre>'+esc(ui.rcpt)+'</pre>';try{window.print()}catch(e){}toast('Dialog cetak dibuka. Jika tidak muncul, gunakan Salin.')},
/* produk & stok */
pfClear:()=>{ui.pf.foto=null;pfPreview()},prodNew:()=>prodForm(),prodEdit:el=>prodForm(el.dataset.id),
prodSave:el=>saveProd(el.dataset.id||null),
prodOff:el=>confirmBox('Nonaktifkan produk ini? Produk tidak tampil di kasir dan daftar, riwayat penjualan tetap tersimpan.','Nonaktifkan',()=>{const p=prod(el.dataset.id);p.aktif=false;log('Menonaktifkan produk '+p.kode);save();renderPage();toast('Produk dinonaktifkan')},true),
batches:el=>batchModal(el.dataset.id),
stockIn:el=>stockInModal(el.dataset.id),
stockInSave:()=>{const q=iv('si_q');if(q<=0)return toast('Jumlah harus lebih dari 0',1);const p=prod($('#si_p').value);addStock(p.id,q,$('#si_e').value||null,$('#si_b').value.trim(),$('#si_k').value.trim()||'Barang masuk');log(`Barang masuk ${q} ${p.nama}`);save();closeModal();renderPage();toast(`+${q} ${p.nama}`)},
opSave:()=>{
  const ent=Object.entries(ui.opname).filter(([,v])=>v!=='');if(!ent.length)return toast('Isi minimal satu hitungan fisik',1);
  const st=stats(),items=[],cat=($('#onote')||{}).value||'';
  for(const [pid,v] of ent){const f=parseInt(v);if(isNaN(f)||f<0)return toast('Hitungan fisik tidak valid',1);const s=st[pid].tot,d=f-s;items.push({pid,sistem:s,fisik:f,selisih:d});
    if(d>0){DB.batches.push({id:uid('b'),id_produk:pid,kode:'OPN-'+today().replace(/-/g,''),jumlah:d,exp:null,masuk:today()});mov(pid,'opname',d,'Opname: lebih'+(cat?' · '+cat:''))}
    else if(d<0){takeFEFO(pid,-d,true);mov(pid,'opname',d,'Opname: kurang'+(cat?' · '+cat:''))}}
  DB.opnames.unshift({id:uid('op'),tgl:nowISO(),user:ui.user.id,cat,items});ui.opname={};log(`Stok opname ${items.length} produk, ${items.filter(i=>i.selisih).length} selisih`);save();renderPage();toast('Opname disimpan')},
keluarSave:()=>{const q=iv('ko_q');if(q<=0)return toast('Jumlah harus lebih dari 0',1);const p=prod($('#ko_p').value);if(!takeFEFO(p.id,q,true))return toast('Stok tidak cukup',1);const a=$('#ko_a').value,n=$('#ko_n').value.trim();mov(p.id,'keluar',-q,a+(n?' · '+n:''));log(`Barang keluar ${q} ${p.nama} (${a})`);save();renderPage();toast('Barang keluar dicatat')},
/* pembelian */
poNew:()=>poOpen([{pid:DB.products.find(p=>p.aktif).id,qty:10,harga:DB.products.find(p=>p.aktif).beli}]),
poSuggest:()=>{const st=stats(),it=DB.products.filter(p=>p.aktif&&st[p.id].sell<=p.min).map(p=>({pid:p.id,qty:Math.max(p.min*2-st[p.id].sell,1),harga:p.beli}));if(!it.length)return toast('Semua stok di atas batas minimum');if(!can('pembelian'))return;if(ui.page!=='pembelian'){go('pembelian')}poOpen(it)},
poEdit:el=>poOpen(null,el.dataset.id),
poView:el=>poView(el.dataset.id),
poAdd:()=>{const p=DB.products.find(p=>p.aktif);ui.po.items.push({pid:p.id,qty:10,harga:p.beli});$('#poform').innerHTML=poFormHTML()},
poDel:el=>{ui.po.items.splice(+el.dataset.i,1);$('#poform').innerHTML=poFormHTML()},
poSave:el=>poSave(el.dataset.s),
poSubmit:el=>poSetStatus(el.dataset.id,'diajukan','Pesanan diajukan'),
poApprove:el=>poSetStatus(el.dataset.id,'disetujui','Pesanan disetujui'),
poReject:el=>confirmBox('Tolak pesanan pembelian ini?','Tolak',()=>poSetStatus(el.dataset.id,'ditolak','Pesanan ditolak'),true),
poReceive:el=>poReceiveModal(el.dataset.id),
poReceiveSave:el=>{const o=DB.pos.find(x=>x.id===el.dataset.id);
  for(let k=0;k<o.items.length;k++){if(iv('rq'+k)>0&&!$('#re'+k).value)return toast('Isi tanggal kedaluwarsa untuk setiap barang yang diterima',1)}
  o.items.forEach((i,k)=>{const q=iv('rq'+k);if(q>0){addStock(i.pid,q,$('#re'+k).value,null,'Penerimaan '+o.nomor);const p=prod(i.pid);if(p&&i.harga)p.beli=i.harga}});
  poSetStatus(o.id,'diterima','Barang diterima')},
supEdit:el=>supModal(el.dataset.id),
supSave:el=>{const n=$('#sp_n').value.trim();if(!n)return toast('Nama pemasok wajib diisi',1);const d={nama:n,kontak:$('#sp_k').value.trim(),alamat:$('#sp_a').value.trim()};if(el.dataset.id)Object.assign(DB.suppliers.find(s=>s.id===el.dataset.id),d);else DB.suppliers.push({id:uid('s'),...d});log('Menyimpan pemasok '+n);save();closeModal();renderPage()},
/* laporan */
lapCsv:()=>{const[f,t]=rangeDates();const rows=[['Nomor','Waktu','Kasir','Produk','Jumlah','Harga','Subtotal','Metode','Status']];salesOn(f,t).concat(DB.sales.filter(s=>s.status==='batal'&&s.tanggal.slice(0,10)>=f&&s.tanggal.slice(0,10)<=t)).sort((a,b)=>a.tanggal<b.tanggal?-1:1).forEach(s=>s.items.forEach(i=>rows.push([s.nomor,s.tanggal.replace('T',' '),userName(s.id_kasir),i.nama,i.jumlah,i.harga,i.jumlah*i.harga,METODE[s.metode],s.status])));exportModal('Ekspor penjualan','penjualan-'+f+'_'+t+'.csv',csv(rows),'text/csv')},
stokCsv:()=>{const st=stats(),rows=[['Kode','Nama','Merek','Kategori','Stok','Stok minimum','Harga beli','Harga jual','Nilai persediaan','Kedaluwarsa terdekat','Status']];DB.products.filter(p=>p.aktif).forEach(p=>rows.push([p.kode,p.nama,p.merek,p.kat,st[p.id].tot,p.min,p.beli,p.jual,st[p.id].tot*p.beli,st[p.id].exp||'',statusOf(p,st[p.id])[1]]));exportModal('Ekspor persediaan','persediaan-'+today()+'.csv',csv(rows),'text/csv')},
/* pengguna & pengaturan */
userEdit:el=>userModal(el.dataset.id),
userSave:async el=>{
  const id=el.dataset.id,n=$('#us_n').value.trim(),u=$('#us_u').value.trim().toLowerCase(),r=$('#us_r').value,pw=$('#us_p').value,a=$('#us_a').checked;
  if(!n||!u)return toast('Nama dan nama pengguna wajib diisi',1);
  if(DB.users.some(x=>x.id!==id&&x.username.toLowerCase()===u))return toast('Nama pengguna sudah dipakai',1);
  if(!id&&pw.length<6||pw&&pw.length<6)return toast('Kata sandi minimal 6 karakter',1);
  const owners=DB.users.filter(x=>x.peran==='pemilik'&&x.aktif&&x.id!==id);
  if(id&&(r!=='pemilik'||!a)&&DB.users.find(x=>x.id===id).peran==='pemilik'&&!owners.length)return toast('Harus ada minimal satu pemilik aktif',1);
  if(id===ui.user.id&&!a)return toast('Anda tidak dapat menonaktifkan akun sendiri',1);
  if(id){const x=DB.users.find(z=>z.id===id);Object.assign(x,{nama:n,username:u,peran:r,aktif:a});if(pw){x.salt=mkSalt();x.hash=await hashPw(pw,x.salt)}log('Mengubah pengguna '+u)}
  else{const s=mkSalt();DB.users.push({id:uid('u'),nama:n,username:u,peran:r,salt:s,hash:await hashPw(pw,s),aktif:a,dibuat:today()});log('Menambah pengguna '+u)}
  save();closeModal();renderPage();toast('Pengguna disimpan')},
setSave:()=>{const s=S(),v=i=>$('#'+i).value;Object.assign(s,{toko:v('st_n').trim()||s.toko,alamat:v('st_a').trim(),telepon:v('st_t').trim(),kertas:+v('st_k'),footer:v('st_f').trim(),ppn_aktif:$('#st_pa').checked,ppn:Math.max(0,iv('st_p')),maks_diskon:Math.min(100,iv('st_d')),hari_exp:Math.max(1,iv('st_e'))});log('Mengubah pengaturan toko');save();toast('Pengaturan disimpan')},
bkExport:()=>exportModal('Cadangan data','jelitastock-cadangan-'+today()+'.json',JSON.stringify(DB),'application/json'),
bkText:()=>openModal('Pulihkan dari teks',`<div class="note">Seluruh data saat ini akan diganti dengan isi cadangan.</div><textarea id="bkTxt" rows="8" placeholder="Tempel isi file cadangan (.json) di sini"></textarea>`,`<button class="btn" data-act="closeModal">Batal</button><button class="btn bad" data-act="bkApply">Pulihkan</button>`),
bkApply:()=>restore($('#bkTxt').value),
wipe:()=>confirmBox('Hapus semua produk, stok, transaksi, dan pesanan? Akun pengguna dan pengaturan tetap ada. Buat cadangan lebih dulu bila perlu.','Hapus semua data',()=>{Object.assign(DB,{sample:false,products:[],batches:[],suppliers:[],pos:[],sales:[],mov:[],opnames:[],shifts:[],held:[],seq:{sale:{},po:0},logs:[]});ui.cart=newCart();log('Mengosongkan data');save();renderPage();toast('Data dikosongkan. Mulai dengan menambah barang.')},true),
reseed:()=>confirmBox('Ganti semua data dengan data contoh Jelita Cosmetics? Anda akan keluar dari sistem.','Kembalikan data contoh',async()=>{DB=await seed();save();logout()},true)
};
async function restore(txt){
  try{const o=JSON.parse(txt);if(o.v!==1||!Array.isArray(o.products)||!Array.isArray(o.users)||!o.settings)throw 0;DB=o;save();closeModal();const u=DB.users.find(x=>x.id===ui.user.id&&x.aktif);if(!u){logout();toast('Cadangan dipulihkan. Silakan masuk kembali.');return}ui.user=u;ui.cart=newCart();renderShell();toast('Cadangan dipulihkan')}
  catch(e){toast('Isi cadangan tidak valid',1)}
}
const INS={
q:el=>{ui.q=el.value;const g=$('#pgrid');if(g)g.innerHTML=gridHTML()},
pelanggan:el=>{ui.cart.pelanggan=el.value},
dval:el=>{let v=parseFloat(String(el.value).replace(',','.'))||0;if(ui.cart.dtype==='pct')v=Math.min(100,v);ui.cart.dval=Math.max(0,v);keep(()=>refreshPos(false))},
dtype:el=>{ui.cart.dtype=el.value;refreshPos(false)},
qtyset:el=>{const it=ui.cart.items.find(i=>i.pid===el.dataset.id);if(!it||el.value==='')return;let n=parseInt(el.value)||1;const s=stats()[it.pid].sell;if(n>s){n=s;toast('Stok hanya '+s,1)}it.qty=Math.max(1,n);keep(()=>refreshPos())},
bayar:el=>{const t=cartCalc().total,v=parseInt(String(el.value).replace(/\D/g,''))||0;ui.pay.bayar=v;$('#kmb').textContent=rp(Math.max(0,v-t));$('#kmb').style.color=v<t?'var(--bad)':''},
shiftdiff:el=>{const d=(parseInt(String(el.value).replace(/\D/g,''))||0)-(+el.dataset.exp);$('#sdiff').innerHTML=el.value===''?'':d===0?pill('ok','Kas sesuai'):d>0?pill('warn','Lebih '+rp(d)):pill('bad','Kurang '+rp(-d))},
hq:el=>{ui.hq=el.value;$('#hlist').innerHTML=histHTML()},
hrange:el=>{ui.hrange=el.value;$('#hlist').innerHTML=histHTML()},
pq:el=>{ui.q=el.value;ui.pp=1;$('#ptable').innerHTML=prodTable()},
fkat:el=>{ui.fkat=el.value;ui.pp=1;$('#ptable').innerHTML=prodTable()},
fstat:el=>{ui.fstat=el.value;ui.pp=1;$('#ptable').innerHTML=prodTable()},
oq:el=>{ui.oq=el.value;keep(()=>renderPage())},
opv:el=>{ui.opname[el.dataset.id]=el.value;const c=$('#od_'+el.dataset.id);if(!c)return;if(el.value===''){c.textContent='–';return}const d=parseInt(el.value)-(+el.dataset.s);c.innerHTML=isNaN(d)?'–':`<b style="color:var(--${d<0?'bad':d>0?'ok':'muted'})">${d>0?'+':''}${d}</b>`},
pf_tipe:el=>{ui.pf.tipe=el.value;pfPreview()},pf_up:()=>pfPreview(),
po_s:el=>{ui.po.sid=el.value},po_t:el=>{ui.po.tgl=el.value},po_c:el=>{ui.po.cat=el.value},
po_p:el=>{const it=ui.po.items[+el.dataset.i];it.pid=el.value;it.harga=prod(el.value).beli;keep(()=>$('#poform').innerHTML=poFormHTML())},
po_q:el=>{ui.po.items[+el.dataset.i].qty=parseInt(el.value)||0;keep(()=>$('#poform').innerHTML=poFormHTML())},
po_h:el=>{ui.po.items[+el.dataset.i].harga=parseInt(String(el.value).replace(/\D/g,''))||0;keep(()=>$('#poform').innerHTML=poFormHTML())},
range:el=>{ui.range=el.value;renderPage()},
rfrom:el=>{ui.rfrom=el.value;keep(()=>renderPage())},rto:el=>{ui.rto=el.value;keep(()=>renderPage())},
lq:el=>{ui.lq=el.value;$('#loglist').innerHTML=logHTML()}
};
const CHG={bulkFoto:async el=>{const fs=[...el.files];el.value='';if(!fs.length)return;const nz=x=>String(x).toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[^a-z0-9]/g,'');let ok=0,miss=[];for(const f of fs){const n=nz(f.name);const p=DB.products.find(p=>p.aktif&&(nz(p.kode)===n||(n.length>=4&&(nz(p.nama).includes(n)||n.includes(nz(p.nama))||n.includes(nz(p.merek)+nz(p.nama)))))||p.aktif&&n.includes(nz(p.kode)));if(!p){miss.push(f.name);continue}try{p.foto=await readFoto(f);ok++}catch(e){miss.push(f.name)}}save();$('#ptable').innerHTML=prodTable();toast(ok+' foto dipasang'+(miss.length?', '+miss.length+' tidak cocok: '+miss.slice(0,3).join(', '):''),miss.length&&!ok?1:0)},pfFile:async el=>{const f=el.files[0];if(!f)return;try{ui.pf.foto=await readFoto(f);pfPreview();toast('Foto dipasang. Ketuk Simpan untuk menyimpan.')}catch(e){toast('Foto tidak dapat dibaca',1)}el.value=''},bkFile:el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>confirmBox(`Pulihkan data dari “${esc(f.name)}”? Seluruh data saat ini akan diganti.`,'Pulihkan',()=>restore(r.result),true);r.readAsText(f);el.value=''}};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){const f=ACT[el.dataset.act];if(f)f(el,e);return}
  if(e.target.id==='modal')closeModal();
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&INS[el.dataset.in])INS[el.dataset.in](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CHG[el.dataset.ch])CHG[el.dataset.ch](el,e)});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm')doLogin(e);else e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter==='scan'){e.preventDefault();scan(e.target.value);return}
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
  if(!ui.user)return;
  if(e.key==='F2'&&ui.page==='kasir'){e.preventDefault();const q=$('#q');if(q)q.focus()}
  if(e.key==='F9'&&ui.page==='kasir'){e.preventDefault();if($('#doPay'))checkout();else openPay()}
});
window.addEventListener('hashchange',()=>{if(!ui.user)return;const h=(location.hash||'').slice(1);if(h&&h!==ui.page&&can(h)){ui.page=h;renderPage()}});

/* ---------- mulai ---------- */
async function boot(){
  applyTheme();
  try{const raw=lsGet(KEY);DB=raw?JSON.parse(raw):null}catch(e){DB=null}
  if(!DB||DB.v!==1||!DB.users){DB=await seed();save()}
  const sid=lsGet(SES),u=sid&&DB.users.find(x=>x.id===sid&&x.aktif);
  if(u){ui.user=u;const h=(location.hash||'').slice(1);ui.page=AKSES[u.peran].includes(h)?h:AKSES[u.peran][0];renderShell()}else renderLogin();
}
boot();
</script>
